# Manual release, run from `main` (Actions > Release > Run workflow).
#
# Keep this file named ci.yml: PyPI trusted publishing is registered against the
# filename of the workflow that contains the `publish` job. Renaming it breaks
# publishing until the trusted publisher is re-registered on PyPI.
#
# Pull-request checks live in pr.yml.
name: Release

on:
  workflow_dispatch:
    inputs:
      release-level:
        description: "Release level: auto = decide from conventional commits"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

permissions:
  contents: read

# Never cancel a release part-way through.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: steamwiz/actions/.github/workflows/python-ci.yml@v1
    permissions:
      contents: read
      checks: write
    with:
      python-version: '3.13'
      source-dir: filez4eva
      coverage-min: 95

  # Only runs on main; on any other ref the job is skipped, so dispatching this
  # workflow from a branch is a safe dry run of the tests.
  release:
    needs: test
    uses: steamwiz/actions/.github/workflows/python-release.yml@v1
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      python-version: '3.13'
      release-level: ${{ inputs.release-level }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  build:
    name: Build
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: pip install "poetry==2.*"

      - name: Install project dependencies
        run: poetry install --no-root

      - name: Build distribution
        run: poetry build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
