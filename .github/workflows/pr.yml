name: PR Checks

# Pull requests, and pushes to integration branches (epic/**), so every merge
# into an epic branch gets a run too. Pushes to main aren't included: releases
# run from ci.yml by hand.
on:
  pull_request:
  push:
    branches:
      - 'epic/**'

# Read-only: checks never need to write to the repository.
permissions:
  contents: read
  checks: write

# One run per PR or branch; a new push cancels the superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: steamwiz/actions/.github/workflows/python-ci.yml@v1
    with:
      python-version: '3.14'
      source-dir: filez4eva
      coverage-min: 95
