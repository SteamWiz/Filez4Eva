# Dyngle tools for developers (think of it like Make). Shared operations live
# in the .conf submodule (https://github.com/SteamWiz/Conf).

dyngle:

  imports:
    - .conf/python.dyngle.yml
    - ~/.dyngle.yml

  # Repo-specific settings. coverage-target should match coverage-min in
  # .github/workflows/ci.yml.

  constants:
    coverage-target: '95'
    python-version: '3.14'

  # The package directory, as in .github/workflows/pr.yml. The shared default
  # is the name of the clone's directory, which is 'Filez4Eva' for a fresh
  # clone (or another name for a worktree), so coverage would measure nothing
  # on a case-sensitive filesystem such as Linux.

  expressions:
    source-dir: "'filez4eva'"

  operations:

    # Reset the sandbox source, intake and target directories for manual
    # testing (see the `play` alias in .swytchitrc.sh), e.g.
    # `play classify sandbox/test-source` then `play stow`

    sandbox:
      - rm -rf ./sandbox/test-target
      - rm -rf ./sandbox/test-intake
      - rm -rf ./sandbox/test-source
      - cp -r ./sandbox/test-origin ./sandbox/test-source
